<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>O Povo - teste do Mirador</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        #viewer {
            position: relative;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="viewer"></div>
    <script src="https://unpkg.com/mirador@4.3.0/dist/mirador.min.js"></script>
    <script>
        Mirador.viewer({
            id: 'viewer',
            language: 'pt-BR',
            windows: [{ manifestId: 'http://localhost:8000/manifesto.json' }]
        });
    </script>
</body>

</html>
